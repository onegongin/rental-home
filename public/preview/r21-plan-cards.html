<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>시안 · 평면 안내 타입 카드 그림</title>
<!-- 시안 r21-plan-cards (2026-11-15) — /daelasoo/plan 타입 카드 그림을 3D(3d_<타입>.png) → 평면도(plans/plan_<타입>.jpg = 소스 <타입>_001)로 교체 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:"Pretendard Variable",Pretendard,sans-serif}
  .wrap{max-width:848px;margin:0 auto;padding:28px 16px 60px}
  h1{font-size:22px;margin:0 0 6px} .lead{color:#6e6e73;font-size:14px;margin:0 0 22px;line-height:1.6}
  h2{font-size:16px;margin:26px 0 4px} h2 em{font-style:normal;color:#c8381e;font-size:13px;margin-left:6px}
  .note{color:#6e6e73;font-size:13px;margin:0 0 10px}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .cards a{min-width:0;text-decoration:none;color:#1d1d1f;background:#fff;border:1px solid #ececf0;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
  .cards img{width:100%;object-fit:contain;background:#fafafa;border-radius:8px}
  .sq img{aspect-ratio:1/1} .wd img{aspect-ratio:4/3}
  .c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media(max-width:560px){.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .cards b{font-size:15px} .cards span{font-size:12px;color:#6e6e73}
  @media(max-width:560px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <h1>평면 안내 — 타입 카드 그림 교체 시안</h1>
  <p class="lead">/daelasoo/plan 의 타입 카드 5개 그림을 3D 그림에서 각 타입 평면도(59A_001 · 59B_001 · 59C_001 · 80A_001 · 80B_001)로 바꾸고, 카드를 3×2 로 놓습니다 (5개라 마지막 한 칸은 빔). 휴대폰에서는 2칸씩.</p>

  <h2>시안 — 평면도 · 3×2</h2>
  <div class="cards wd c3" id="a"></div>

  <h2>지금 모양 (3D · 4칸)</h2>
  <div class="cards sq" id="now"></div>
</div>
<script>
const T = [['59A','59.9614',50],['59B','59.6493',50],['59C','59.6493',50],['80A','80.3831',50],['80B','80.8837',100]];
const card = f => T.map(([t, ex, hh]) => `<a href="#"><img src="/daelasoo/assets/dls/plans/${f(t)}" alt="${t}"><b>${t}</b><span>아파트 · 전용 ${ex}㎡ · ${hh}세대</span></a>`).join('');
now.innerHTML = card(t => `3d_${t}.png`);
a.innerHTML = card(t => `plan_${t}.jpg`);
</script>
</body>
</html>
