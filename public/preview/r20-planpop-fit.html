<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>시안 · 평면도 창 한 화면 맞춤</title>
<!-- 시안 r20-planpop-fit (2026-11-15) — 실제 평면도 창(plan-pop.js)을 그대로 열고 아래 CSS 만 덧붙임:
     창 높이를 화면 높이에 맞춰 고정(스크롤 없음) · 모든 타입 같은 높이(실내 사진 있는 59A · 59B · 80A 기준) · 메인 그림은 잘리지 않게 맞춤
     로컬 서버(http://localhost:8787/preview/r20-planpop-fit.html)에서 열기 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  body{margin:0;background:#f5f5f7;font-family:"Pretendard Variable",Pretendard,sans-serif}
  .pick{position:fixed;left:12px;bottom:12px;z-index:9999;background:#1d1d1f;color:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;display:flex;gap:6px;align-items:center}
  .pick button{border:0;border-radius:999px;padding:5px 11px;font:inherit;font-weight:700;cursor:pointer;background:#3a3a3c;color:#fff}
  .pick button.on{background:#c8381e}
</style>
<style id="fit">/* 확정 뒤 plan-pop.js 에 들어감 — 비교 버튼은 지금 동작하지 않음 */</style>
<script src="/daelasoo/plan-pop.js"></script>
</head>
<body>
<div class="pick"><b style="margin-right:4px">시안 · 한 화면 맞춤</b><span id="tp"></span><button id="cmp">지금 모양과 비교</button></div>
<script>
let S, k = '59A';
async function go(t) {
  k = t; if (!S) S = await fetch('/daelasoo/data/site.json').then(r => r.json());
  window.hwPlanPop.open(t, { types: S.types, base: '/daelasoo/assets/dls/', ver: S.assetVer || 1, onBoard() {}, onReg() {} });
  document.getElementById('tp').innerHTML = Object.keys(S.types).map(x => `<button class="${x === t ? 'on' : ''}" onclick="go('${x}')">${x}</button>`).join('');
}
document.getElementById('cmp').onclick = () => { const f = document.getElementById('fit'); f.disabled = !f.disabled; document.getElementById('cmp').textContent = f.disabled ? '시안 모양으로' : '지금 모양과 비교'; go(k); };
go('59A');
</script>
</body>
</html>
