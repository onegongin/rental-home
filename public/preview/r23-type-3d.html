<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>시안 · 타입 페이지 3D 평면</title>
<!-- 시안 r23-type-3d (2026-11-15) — /daelasoo/plan/<타입> 왼쪽 그림을 각 타입 3D 평면(plans/main3d_<타입>.jpg = 소스 <타입>_3D.png)으로 교체 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:"Pretendard Variable",Pretendard,sans-serif}
  .wrap{max-width:848px;margin:0 auto;padding:28px 16px 60px}
  .lead{color:#6e6e73;font-size:14px;margin:0 0 14px;line-height:1.6} h1{font-size:22px;margin:0 0 6px}
  h2{font-size:16px;margin:24px 0 8px} h2 em{font-style:normal;color:#c8381e;font-size:13px;margin-left:6px}
  .tl{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}.tl button{border:1px solid #d2d2d7;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;background:#fff;cursor:pointer}.tl button.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
  .card{background:#fff;border:1px solid #ececf0;border-radius:14px;padding:18px}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
  .wide{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:center}
  .fig{margin:0}.fig img{width:100%;display:block;border-radius:10px;background:#fafafa}.fig figcaption{font-size:12px;color:#6e6e73;margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #ececf0;vertical-align:top}th{color:#6e6e73;font-weight:600;width:34%}
  @media(max-width:560px){.grid2,.wide{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>타입 페이지 — 왼쪽 그림을 3D 평면으로</h1>
  <p class="lead">/daelasoo/plan/59a 처럼 타입별 페이지 왼쪽 평면도 그림을 각 타입 3D 평면(59A_3D · 59B_3D · 59C_3D · 80A_3D · 80B_3D)으로 바꿉니다. 아래 단추로 타입을 바꿔 보세요.</p>
  <div class="tl" id="tabs"></div>

  <h2>A안 — 그림 칸 넓게 (그림 6 : 표 4) <em>추천</em></h2>
  <div class="card grid2 wide" id="a"></div>

  <h2>B안 — 지금처럼 반반</h2>
  <div class="card grid2" id="b"></div>
</div>
<script>
let S;
const row = (k, v) => `<tr><th>${k}</th><td>${v}</td></tr>`;
function go(t) {
  const T = S.types[t], bl = Object.entries(T.byBlock || {}), [bn, bv] = bl[0] || ['', {}];
  const html = `<figure class="fig"><img src="/daelasoo/assets/dls/plans/main3d_${t}.jpg?v=${S.assetVer || 1}" alt="${t}"><figcaption>${t}타입 3D 평면 (${bn})</figcaption></figure>
    <table>${row('구분', T.kind || '아파트')}${bl.map(([b, v]) => row(b, `전용 ${v.exclusive}㎡ · 공급 ${v.supply}㎡ · ${v.households || 0}세대`)).join('')}${row('방 · 욕실', `방 ${T.rooms} · 욕실 ${T.baths}`)}${row('있는 동', '<span id=dg>…</span>')}${row('향', '라인 · 호실마다 다름 (매물에 표시)')}</table>`;
  a.innerHTML = b.innerHTML = html;
  fetch('/daelasoo/plan/' + t.toLowerCase()).then(r => r.text()).then(h => { const m = h.match(/있는 동<\/th><td>([^<]*)/); document.querySelectorAll('#dg').forEach(x => x.textContent = m ? m[1] : '—'); });
  tabs.innerHTML = Object.keys(S.types).map(x => `<button class="${x === t ? 'on' : ''}" onclick="go('${x}')">${x}</button>`).join('');
}
fetch('/daelasoo/data/site.json').then(r => r.json()).then(d => { S = d; go('59A'); });
</script>
</body>
</html>
