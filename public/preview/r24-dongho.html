<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>시안 · 단지 개요 동호 배치도</title>
<!-- 시안 r24-dongho (2026-11-15) — /daelasoo/dongho 단지배치 옆 빈 '동 · 호 배치도' 칸에 층호배치_101-104동 그림(assets/dls/dongho_all.jpg, 로고 새김) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:"Pretendard Variable",Pretendard,sans-serif}
  .wrap{max-width:848px;margin:0 auto;padding:28px 16px 60px}
  .lead{color:#6e6e73;font-size:14px;margin:0 0 14px;line-height:1.6} h1{font-size:22px;margin:0 0 6px}
  .ttl{font-size:16px;font-weight:800;margin:24px 0 8px} .ttl em{font-style:normal;color:#c8381e;font-size:13px;margin-left:6px}
  .sec{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px}.sec>h2{font-size:22px;font-weight:800;margin:0 0 12px}
  .h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}.h3 b{font-size:15px;font-weight:800}.h3 span{font-size:12px;color:#6e6e73}
  .sum{display:grid;gap:18px;align-items:start}
  .sum img{width:100%;display:block;border-radius:12px}
  .sp img{background:#1d1d1f}
  .dh a{display:block;cursor:zoom-in}.dh img{border:1px solid #ececf0;background:#fff}
  .a .sum{grid-template-columns:minmax(0,1.82fr) minmax(0,1fr)}
  .b .sum{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pills span{flex:1 1 220px;text-align:center;background:#fbf3f1;border:1px solid #f2dcd6;border-radius:9999px;padding:9px 14px;font-size:13px;font-weight:700;color:#3a3a3c}
  @media(max-width:760px){.a .sum,.b .sum{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>단지 개요 — 동 · 호 배치도 넣기</h1>
  <p class="lead">/daelasoo/dongho 단지배치 옆 빈 '동 · 호 배치도' 칸에 층호배치(101~104동) 그림을 넣습니다. 그림을 누르면 크게 보입니다. 칸 나누기 2가지 중 골라 주세요.</p>

  <div class="ttl">A안 — 두 그림 높이 맞춤 (오른쪽 글씨가 작음)</div>
  <div class="sec a" id="a"></div>

  <div class="ttl">B안 — 반반 (오른쪽 그림이 크고 길어짐 · 호수 글씨가 읽힘) <em>추천</em></div>
  <div class="sec b" id="b"></div>
</div>
<script>
const V = '?v=' + Date.now(), A = '/daelasoo/assets/dls/';
a.innerHTML = b.innerHTML = `<h2>단지 개요</h2><div class="sum">
  <div class="sp"><div class="h3"><b>단지배치</b><span>1차</span></div><img src="${A}siteplan.jpg${V}" alt="단지배치도"></div>
  <div class="dh"><div class="h3"><b>동 · 호 배치도</b><span>101 ~ 104동 · 누르면 크게</span></div><a href="${A}dongho_all.jpg${V}" target="_blank"><img src="${A}dongho_all.jpg${V}" alt="101~104동 동호배치도"></a></div>
</div><div class="pills"><span>아파트 300세대 · 세대 4 ~ 28층</span><span>80㎡ 150세대 (80A 50 · 80B 100) · 59㎡ 150세대 (59A · 59B · 59C 각 50)</span><span>101 · 104동 4층 광폭테라스 세대</span></div>`;
</script>
</body>
</html>
