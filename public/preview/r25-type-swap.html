<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>시안 · 타입 페이지 그림 바꿔 보기</title>
<!-- 시안 r25-type-swap (2026-11-15) — /daelasoo/plan/<타입>: 큰 그림 = 3D 평면, 왼쪽 아래 모서리 작은 그림 = 평면도(_001). 작은 그림을 누르면 둘이 자리를 바꿈.
     글씨 줄(figcaption) 삭제. 스크립트 없이 CSS(체크박스)만으로 동작 — 검색용 페이지에도 그대로 씀 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:"Pretendard Variable",Pretendard,sans-serif}
  .wrap{max-width:848px;margin:0 auto;padding:28px 16px 60px}
  .lead{color:#6e6e73;font-size:14px;margin:0 0 14px;line-height:1.6} h1{font-size:22px;margin:0 0 6px}
  .tl{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}.tl button{border:1px solid #d2d2d7;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:700;background:#fff;cursor:pointer}.tl button.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
  .card{background:#fff;border:1px solid #ececf0;border-radius:14px;padding:18px}
  .g3d{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid #ececf0;vertical-align:top}th{color:#6e6e73;font-weight:600;width:34%}
  /* ↓ 새로 들어가는 부분 */
  .sw{margin:0;position:relative}
  .sw input{position:absolute;opacity:0;pointer-events:none}
  .sw .big{width:100%;aspect-ratio:5/3;object-fit:contain;display:block;border-radius:10px;background:#fff}
  .sw .b2,.sw .t3{display:none}
  .sw input:checked ~ .b3,.sw input:checked ~ label .t2{display:none}
  .sw input:checked ~ .b2,.sw input:checked ~ label .t3{display:block}
  .sw label{position:relative;display:block;width:150px;cursor:pointer;background:#fff;border:1px solid #d2d2d7;border-radius:10px;padding:4px;box-sizing:border-box;transition:border-color .15s}
  .sw label:hover{border-color:#c8381e}
  /* A안: 큰 그림 아래 줄 */
  .la .sw label{margin-top:8px}
  /* B안: 큰 그림 왼쪽 세로 칸 */
  .lb .sw{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:end}
  .lb .sw .big{grid-column:2;grid-row:1}.lb .sw label{grid-column:1;grid-row:1;width:110px}
  .ttl{font-size:16px;font-weight:800;margin:20px 0 8px}.ttl em{font-style:normal;color:#c8381e;font-size:13px;margin-left:6px}
  .sw label img{width:100%;aspect-ratio:3/2;object-fit:contain;display:block;border-radius:6px;background:#fff}
  .sw label span{position:absolute;right:6px;top:6px;background:rgba(29,29,31,.82);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 7px}
  .sw label .k3{display:none}.sw input:checked ~ label .k2{display:none}.sw input:checked ~ label .k3{display:inline}
  .sw input:focus-visible ~ label{outline:2px solid #0066cc;outline-offset:2px}
  /* 크게 보기 창 (확대 · 끌어서 이동) */
  .sw .big{cursor:zoom-in}
  #zv{position:fixed;inset:0;z-index:1000;background:#111113;display:none;flex-direction:column;font-family:inherit;color:#fff}
  #zv.on{display:flex}
  #zv .zh{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
  #zv .zh b{font-size:15px;margin-right:auto}
  #zv button{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:13px;font-weight:700;padding:8px 13px;cursor:pointer;min-width:38px}
  #zv button:hover{background:rgba(255,255,255,.26)} #zv button.on{background:#c8381e}
  #zv .zp{font-size:12.5px;min-width:46px;text-align:center;color:#d1d1d6}
  #zv .zs{flex:1 1 auto;min-height:0;overflow:hidden;position:relative;cursor:grab;touch-action:none;user-select:none}
  #zv .zs.drag{cursor:grabbing}
  #zv .zs img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;background:#fff;border-radius:6px;-webkit-user-drag:none;pointer-events:none}
  #zv .zf{padding:8px 14px 12px;font-size:12px;color:#aeaeb2;text-align:center}
  @media(max-width:560px){.g3d{grid-template-columns:1fr}.la .sw label{width:38%}.lb .sw{grid-template-columns:28% minmax(0,1fr)}.lb .sw label{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <h1>타입 페이지 — 3D · 평면도 바꿔 보기</h1>
  <p class="lead">큰 그림을 누르면 크게 보기 창이 뜹니다 — 마우스 휠(휴대폰은 두 손가락)로 확대, 끌어서 이동, 두 번 누르면 확대/원래대로, 창 안에서 3D · 평면도 바꿔 보기. 작은 그림을 누르면 3D ↔ 평면도가 자리를 바꿉니다. 작은 그림 자리는 A · B 중 골라 주세요.</p>
  <div class="tl" id="tabs"></div>
  <div class="ttl">A안 — 큰 그림 아래 왼쪽에 작은 그림 <em>추천</em></div>
  <div class="card g3d la" id="a"></div>
  <div class="ttl">B안 — 큰 그림 왼쪽에 작은 그림 (세로 칸)</div>
  <div class="card g3d lb" id="b"></div>
</div>
<div id="zv" role="dialog" aria-modal="true" aria-label="크게 보기">
  <div class="zh"><b id="zt"></b><button type="button" data-k="3d">3D</button><button type="button" data-k="2d">평면도</button><span style="width:8px"></span><button type="button" data-z="-1" aria-label="작게">－</button><span class="zp" id="zp">100%</span><button type="button" data-z="1" aria-label="크게">＋</button><button type="button" data-z="0">원래대로</button><button type="button" data-x aria-label="닫기">✕</button></div>
  <div class="zs" id="zs"><img id="zi" alt=""></div>
  <div class="zf">마우스 휠 · 두 손가락으로 확대 · 끌어서 이동 · 두 번 누르면 확대/원래대로 · Esc 닫기</div>
</div>
<script>
// 크게 보기 — 큰 그림을 누르면 열림. 확대(휠 · 단추 · 두 손가락 · 두 번 누르기) · 끌어서 이동
(() => {
  const zv = document.getElementById('zv'), zs = document.getElementById('zs'), zi = document.getElementById('zi'), zp = document.getElementById('zp'), zt = document.getElementById('zt');
  let src = {}, k = '3d', z = 1, fz = 1, x = 0, y = 0, pts = new Map(), last = null, pinch = null;
  const draw = () => { zi.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + z + ')'; zp.textContent = Math.round(z / fz * 100) + '%'; };
  const fit = () => { const W = zs.clientWidth, H = zs.clientHeight, w = zi.naturalWidth || 1, h = zi.naturalHeight || 1; fz = z = Math.min(W / w, H / h) * .96; x = (W - w * z) / 2; y = (H - h * z) / 2; draw(); };
  const clamp = () => { const W = zs.clientWidth, H = zs.clientHeight, w = zi.naturalWidth * z, h = zi.naturalHeight * z; x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, x)); y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, y)); };
  const zoomAt = (nz, cx, cy) => { nz = Math.min(Math.max(fz * 2, 2), Math.max(fz, nz)); x = cx - (cx - x) * nz / z; y = cy - (cy - y) * nz / z; z = nz; clamp(); draw(); };
  const show = kk => { k = kk; zi.onload = fit; zi.src = src[k]; zt.textContent = src.t + '타입 ' + (k === '3d' ? '3D 평면' : '평면도'); zv.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === k)); };
  window.zvOpen = (t, s3, s2, first) => { src = { t, '3d': s3, '2d': s2 }; zv.classList.add('on'); document.body.style.overflow = 'hidden'; show(first); };
  const close = () => { zv.classList.remove('on'); document.body.style.overflow = ''; };
  zv.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.k) show(b.dataset.k); else if ('x' in b.dataset) close(); else { const d = +b.dataset.z, r = zs.getBoundingClientRect(); d ? zoomAt(z * (d > 0 ? 1.4 : 1 / 1.4), r.width / 2, r.height / 2) : fit(); } });
  zs.addEventListener('wheel', e => { e.preventDefault(); const r = zs.getBoundingClientRect(); zoomAt(z * Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  zs.addEventListener('dblclick', e => { const r = zs.getBoundingClientRect(); z > fz * 1.05 ? fit() : zoomAt(fz * 2.5, e.clientX - r.left, e.clientY - r.top); });
  zs.addEventListener('pointerdown', e => { zs.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); last = e; zs.classList.add('drag'); });
  zs.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e); const r = zs.getBoundingClientRect();
    if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), cx = (a.clientX + b.clientX) / 2 - r.left, cy = (a.clientY + b.clientY) / 2 - r.top; if (pinch) zoomAt(z * d / pinch, cx, cy); pinch = d; return; }
    x += e.clientX - last.clientX; y += e.clientY - last.clientY; last = e; clamp(); draw();
  });
  const up = e => { pts.delete(e.pointerId); pinch = null; last = [...pts.values()][0] || null; if (!pts.size) zs.classList.remove('drag'); };
  zs.addEventListener('pointerup', up); zs.addEventListener('pointercancel', up);
  addEventListener('keydown', e => { if (e.key === 'Escape' && zv.classList.contains('on')) close(); });
  addEventListener('resize', () => { if (zv.classList.contains('on')) fit(); });
  // 큰 그림을 누르면 지금 보이는 그림(3D 또는 평면도)으로 열림
  document.addEventListener('click', e => { const im = e.target.closest('.sw .big'); if (!im) return; const f = im.closest('.sw'); zvOpen(f.dataset.t, f.querySelector('.b3').src, f.querySelector('.b2').src, im.classList.contains('b3') ? '3d' : '2d'); });
})();
let S;
const row = (k, v) => `<tr><th>${k}</th><td>${v}</td></tr>`;
function go(t) {
  const T = S.types[t], bl = Object.entries(T.byBlock || {}), V = '?v=' + (S.assetVer || 1), P = '/daelasoo/assets/dls/plans/';
  const H = id => `<figure class="sw" data-t="${t}"><input type="checkbox" id="sw-${id}-${t}" aria-label="3D 평면 · 평면도 바꿔 보기">
      <img class="big b3" src="${P}main3d_${t}.jpg${V}" alt="${t}타입 3D 평면도"><img class="big b2" src="${P}plan_${t}.jpg${V}" alt="${t}타입 평면도">
      <label for="sw-${id}-${t}" title="눌러서 바꿔 보기"><img class="t2" src="${P}plan_${t}.jpg${V}" alt=""><img class="t3" src="${P}main3d_${t}.jpg${V}" alt=""><span class="k2">평면도</span><span class="k3">3D</span></label></figure>
    <table>${row('구분', T.kind || '아파트')}${bl.map(([b, v]) => row(b, `전용 ${v.exclusive}㎡ · 공급 ${v.supply}㎡ · ${v.households || 0}세대`)).join('')}${row('방 · 욕실', `방 ${T.rooms} · 욕실 ${T.baths}`)}${row('있는 동', '<span class=dg>…</span>')}${row('향', '라인 · 호실마다 다름 (매물에 표시)')}</table>`;
  a.innerHTML = H('a'); b.innerHTML = H('b');
  fetch('/daelasoo/plan/' + t.toLowerCase()).then(r => r.text()).then(h => { const m = h.match(/있는 동<\/th><td>([^<]*)/); document.querySelectorAll('.dg').forEach(x => x.textContent = m ? m[1] : '—'); });
  tabs.innerHTML = Object.keys(S.types).map(x => `<button class="${x === t ? 'on' : ''}" onclick="go('${x}')">${x}</button>`).join('');
}
fetch('/daelasoo/data/site.json').then(r => r.json()).then(d => { S = d; go('59A'); });
</script>
</body>
</html>
