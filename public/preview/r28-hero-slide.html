<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>시안 · 메인 사진 슬라이드</title>
<!-- 시안 r28-hero-slide (2026-11-16) — 단지 화면 맨 위 큰 사진을 sky001 > sky003 > sky002 > sky004 > 지금 사진(hero_wide) 순서로 자동 넘김.
     5초마다 부드럽게 바뀜(겹쳐 사라지기) · 아래 점 · ‹ › 로 직접 넘김 · 아래 흰 줄 = 다음 사진까지 남은 시간 · sky001 · sky002 는 위쪽 맞춤(아파트 꼭대기) · 휴대폰은 손가락으로 밀어 넘김 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:"Pretendard Variable",Pretendard,sans-serif}
  .wrap{max-width:1720px;margin:0 auto;padding:24px 20px 60px;box-sizing:border-box}
  .lead{color:#6e6e73;font-size:14px;margin:0 0 14px;line-height:1.6} h1{font-size:22px;margin:0 0 6px}
  .hero{position:relative;aspect-ratio:2.3/1;border-radius:18px;overflow:hidden;background:#1d1d1f;touch-action:pan-y}
  .hero .sl{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
  .hero .sl.on{opacity:1}
  .hero .sl img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04);transition:transform 6.5s ease-out}
  .hero .sl.on img{transform:scale(1)}
  .hero .sh{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 38%);pointer-events:none}
  .hero .tx{position:absolute;left:28px;bottom:42px;color:#fff;pointer-events:none}
  .hero .tx b{display:block;font-size:40px;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 10px rgba(0,0,0,.35)}
  .hero .tx span{display:block;font-size:15px;margin-top:6px;opacity:.95;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .hero .bar{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.85);width:0}
  .hero .bar.go{width:100%;transition:width 5s linear}
  .hero .dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:7px}
  .hero .dots button{width:9px;height:9px;border-radius:999px;border:0;padding:0;background:rgba(255,255,255,.5);cursor:pointer;transition:width .3s,background .3s}
  .hero .dots button.on{width:26px;background:#fff}
  .hero .nv{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.82);font-size:22px;color:#1d1d1f;cursor:pointer;opacity:0;transition:opacity .2s}
  .hero:hover .nv{opacity:1}.hero .pv{left:16px}.hero .nx{right:16px}
  @media(max-width:760px){.hero{aspect-ratio:4/3}.hero .tx{left:16px;bottom:34px}.hero .tx b{font-size:26px}.hero .tx span{font-size:12.5px}.hero .nv{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>메인 사진 슬라이드</h1>
  <p class="lead">sky001 → sky003 → sky002 → sky004 → 지금 사진 순서로 5초마다 저절로 넘어갑니다(아래 흰 줄이 차오르면 다음 사진). 아래 점이나 ‹ › 로 직접 넘길 수도 있습니다. sky001 · sky002 는 아파트 꼭대기가 보이게 사진 위쪽에 맞췄습니다. 휴대폰은 손가락으로 밀어 넘깁니다.</p>
  <div class="hero" id="hero">
    <div class="sh"></div>
    <div class="tx"><b>첨단대라수1차</b><span>광주 첨단 민간임대 · 분양전환 · 101~104동 아파트 300세대 · 80㎡ · 59㎡ 5개 타입 · 분양전환 · 관심등록 상담 1800-7240</span></div>
    <button class="nv pv" type="button" aria-label="이전 사진">‹</button><button class="nv nx" type="button" aria-label="다음 사진">›</button>
    <div class="dots" id="dots"></div><div class="bar" id="bar"></div>
  </div>
</div>
<script>
const A = '/daelasoo/assets/dls/', IMGS = [['sky1.jpg', 'center 0%'], ['sky3.jpg', 'center 45%'], ['sky2.jpg', 'center 0%'], ['sky4.jpg', 'center 45%'], ['hero_wide.jpg', 'center 40%']], hero = document.getElementById('hero'), dots = document.getElementById('dots');
IMGS.forEach(([f, pos], i) => { const d = document.createElement('div'); d.className = 'sl'; d.innerHTML = '<img src="' + A + f + '?v=5" style="object-position:' + pos + '" alt="첨단대라수1차 투시도 ' + (i + 1) + '"' + (i ? ' loading="lazy"' : '') + '>'; hero.insertBefore(d, hero.firstChild); });
const sl = [...hero.querySelectorAll('.sl')].reverse();
dots.innerHTML = IMGS.map((_, i) => '<button type="button" aria-label="' + (i + 1) + '번째 사진"></button>').join('');
let cur = -1, t = null, hold = false;
const bar = document.getElementById('bar');
const go = i => { bar.classList.remove('go'); void bar.offsetWidth; bar.classList.add('go'); cur = (i + IMGS.length) % IMGS.length; sl.forEach((s, j) => s.classList.toggle('on', j === cur)); [...dots.children].forEach((b, j) => b.classList.toggle('on', j === cur)); };
const run = () => { clearInterval(t); t = setInterval(() => { if (!hold && !document.hidden) go(cur + 1); }, 5000); };
go(0); run();
dots.onclick = e => { const b = e.target.closest('button'); if (b) { go([...dots.children].indexOf(b)); run(); } };
hero.querySelector('.pv').onclick = () => { go(cur - 1); run(); }; hero.querySelector('.nx').onclick = () => { go(cur + 1); run(); };

let sx = null; hero.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
hero.addEventListener('touchend', e => { if (sx == null) return; const d = e.changedTouches[0].clientX - sx; if (Math.abs(d) > 40) { go(cur + (d < 0 ? 1 : -1)); run(); } sx = null; });
</script>
</body>
</html>
