<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>시안 · 입지 페이지 6대 메가 프리미엄</title>
<!-- 시안 r22-location-premium (2026-11-15) — /daelasoo/location 의 빈 '입지 · 개발 계획' 칸에 단지 화면의 '6대 메가 프리미엄' 보드(site.json content.siteMap.board.premium)를 그대로 보여 줌.
     검색용 페이지라 글은 줄임 없이 전부 보이고(검색엔진이 읽음), 그림을 누르면 크게 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:"Pretendard Variable",Pretendard,sans-serif}
  .wrap{max-width:848px;margin:0 auto;padding:28px 16px 60px}
  .tl{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.tl a{border:1px solid #d2d2d7;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:#1d1d1f;text-decoration:none;background:#fff}.tl a.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
  .bc{font-size:12px;color:#6e6e73;margin-bottom:10px} h1{font-size:22px;margin:0 0 6px} .sub{color:#6e6e73;font-size:14px;margin:0 0 16px}
  .sec{background:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
  .bhd{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;margin-bottom:12px}.bhd b{font-size:17px}.bhd span{font-size:13px;color:#6e6e73}
  /* ↓ 새로 들어가는 부분 */
  .pmh{padding-top:12px;border-top:1px solid #ececf0;margin-bottom:12px}
  .pmh h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.01em}
  .pmh p{margin:0;font-size:13px;color:#3a3a3c;font-weight:600;line-height:1.5}
  .pm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .pm a{display:flex;flex-direction:column;min-width:0;border:1px solid #e5e5ea;border-radius:12px;padding:8px 8px 12px;text-decoration:none;color:inherit;background:#fff}
  .pm a:hover{border-color:#c8381e}
  .pm img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:center top;border-radius:8px;background:#f5f5f7;display:block}
  .pm i{font-style:normal;font-size:10.5px;font-weight:800;color:#c8381e;margin:9px 0 2px;letter-spacing:.3px}
  .pm h3{margin:0;font-size:14.5px;font-weight:800;line-height:1.35}
  .pm p{margin:4px 0 0;font-size:12.5px;color:#475569;line-height:1.55}
  .pmn{margin:10px 0 0;font-size:11.5px;color:#8e8e93}
  @media(max-width:560px){.pm{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .cta{background:#fff;border:1px solid #ececf0;border-radius:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:14px}
  .cta span{display:flex;gap:8px}.cta em{font-style:normal;border-radius:999px;padding:10px 16px;color:#fff;background:#0066cc}.cta em+em{background:#c8381e}.cta em+em+em{background:#1d1d1f}
</style>
</head>
<body>
<div class="wrap">
  <div class="tl"><a href="#">평면</a><a href="#">단지 개요</a><a href="#" class="on">입지</a><a href="#">현재 매물</a></div>
  <nav class="bc">홈 › 입지</nav>
  <h1>첨단대라수1차 입지환경</h1>
  <p class="sub">광주 첨단 · 쌍암공원 생활권 · 도시철도 2호선 쌍암역(예정)</p>
  <div class="sec" id="sec"></div>
  <div class="cta">입지 · 생활권 상담<span><em>관심등록하기</em><em>방문상담 예약</em><em>☎ 1800-7240</em></span></div>
</div>
<script>
fetch('/daelasoo/data/site.json').then(r => r.json()).then(S => {
  const B = S.content.siteMap.board, M = B.premium, V = '?v=' + (S.assetVer || 1), A = '/daelasoo/assets/dls/';
  const e = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  sec.innerHTML = `<div class="bhd"><b>${e(B.title)}</b><span>${e(B.sub)}</span></div>
    <div class="pmh"><h2>${e(M.title)}</h2><p>${e(M.lead)}</p></div>
    <div class="pm">${M.items.map((x, i) => `<a href="${A + x.img + V}" target="_blank" title="크게 보기"><img src="${A + x.img + V}" alt="${e(x.title)}" loading="lazy"><i>PREMIUM ${String(i + 1).padStart(2, '0')}</i><h3>${e(x.title)}</h3><p>${e(x.desc)}</p></a>`).join('')}</div>
    <p class="pmn">※ 안내 그림입니다. 예정 사항은 관계기관 사정에 따라 바뀔 수 있습니다.</p>`;
});
</script>
</body>
</html>
