<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<title>분양전환 KPI</title>
<!-- R3-1 KPI 보드 + 미상담 세대 (시안 preview/r3-kpi 확정 2026-11-13) — 서버 src/staff-api/kpi.js · 계산 src/core/kpi.js -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{--bg:#f5f5f7;--ink:#1d1d1f;--sub:#6e6e73;--line:#ececf0;--link:#0066cc;--on:#c8381e;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif}
  a{color:var(--link);text-decoration:none}
  .top{background:#fff;border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
  .top a{font-size:14px;font-weight:600}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 64px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:22px;font-weight:800;margin:0}
  .head p{margin:4px 0 0;color:var(--sub);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  h2{font-size:15px;font-weight:800;margin:0 0 10px}
  .hero{display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:10px;margin-bottom:12px}
  .k{padding:14px 16px;position:relative}
  .k small{display:block;font-size:12px;font-weight:700;color:var(--sub)}
  .k b{display:block;font-size:28px;font-weight:800;line-height:1.15;margin-top:4px}
  .k em{font-style:normal;font-size:12px;color:var(--sub);font-weight:600}
  .k .today{display:inline-block;vertical-align:middle;margin-left:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:#fdecea;color:var(--on);line-height:1.4}
  .k.main .today{background:#5c1d14;color:#ffd0c7}
  .k.main{background:#1d1d1f;color:#fff;border-color:#1d1d1f}.k.main small,.k.main em{color:#a1a1a6}
  .k.main b{font-size:34px}
  a.k{color:inherit}a.k:hover{border-color:#c7c7cc}
  .prog{height:8px;border-radius:99px;background:#3a3a3c;margin-top:10px;overflow:hidden;display:flex}
  .prog i{display:block;height:100%}
  .row2{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
  .row2 .k b{font-size:22px}
  .dist{padding:16px;margin-bottom:16px}
  .bar{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-bottom:10px;background:#f0f0f3}
  .bar i{display:block;height:100%}
  .lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:#3a3a3c}
  .lg span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .lg b{margin-left:3px}
  .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
  .cols>div{min-width:0}
  .sec{padding:16px;margin-bottom:14px}
  .dongs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .dong small{display:block;font-size:12px;font-weight:800;margin-bottom:4px}
  .g{display:grid;gap:2px}
  .g i{display:block;height:9px;border-radius:2px;background:#ececf0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{font-size:11.5px;color:var(--sub);font-weight:700}
  td.n,th.n{text-align:right}
  tr.go{cursor:pointer}tr.go:hover{background:#fafafc}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px}
  .note{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
  .gate{padding:40px 20px;text-align:center;line-height:1.7}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
  @media (max-width:980px){.hero{grid-template-columns:repeat(3,1fr)}.k.main{grid-column:1/-1}.row2{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:minmax(0,1fr)}}
  @media (max-width:560px){.hero,.row2{grid-template-columns:repeat(2,1fr)}.dongs{grid-template-columns:repeat(2,1fr)}h1{font-size:19px}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><a href="./">← 직원 대시보드</a><a href="units.html">세대 전환 상태</a><a href="consults.html">상담카드</a></div></div>
<div class="wrap" id="app"><div class="card gate">불러오는 중…</div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ST = [['계약완료', '#1d4ed8'], ['신규입주', '#0f766e'], ['계약중', '#047857'], ['가계약', '#65a30d'], ['전세연장', '#a16207'], ['상담중', '#f59e0b'], ['호실변경', '#a855f7'], ['장기부재', '#dc2626'], ['퇴거확정', '#e11d48'], ['퇴거확정(매물동의)', '#7e22ce'], ['공실', '#0891b2'], ['미정', '#d2d2d7']];
const COL = Object.fromEntries(ST);
const uName = id => { const m = String(id || '').match(/^(\d+)-(\d+)$/); return m ? m[1] + '동 ' + m[2] + '호' : ''; };
const WD = ['일', '월', '화', '수', '목', '금', '토'];
let K = null, mgr = '', days = 30;

async function load() {
  const r = await fetch('/api/staff/kpi?days=' + days, { credentials: 'same-origin' });
  if (r.status === 401 || r.status === 403) { $('app').innerHTML = '<div class="card gate">직원 로그인이 필요합니다.<br><a href="./">직원 대시보드에서 로그인</a>한 뒤 이 화면을 다시 열어 주세요.</div>'; return; }
  const j = await r.json().catch(() => null);
  if (!j || !j.ok) { $('app').innerHTML = '<div class="card gate">자료를 불러오지 못했습니다. 새로고침해 주세요.</div>'; return; }
  K = j; draw();
}

function draw() {
  const V = mgr ? K.units.filter(u => u.mgr === mgr) : K.units, tot = V.length || 1;
  const nn = (...s) => V.filter(u => s.includes(u.st)).length;
  const td = (...s) => V.filter(u => u.todayChg && s.includes(u.st)).length;
  const A = mgr ? (K.byMgr.find(x => x.mgr === mgr) || { visitToday: 0, visitAll: 0, otherToday: 0, otherAll: 0 }) : K.act;
  const B = mgr ? K.books.filter(b => b.mgr === mgr) : K.books;
  const U = mgr ? K.unvisited.filter(u => u.mgr === mgr) : K.unvisited;
  const done = nn('계약완료', '신규입주'), d = new Date(K.today + 'T00:00:00');
  const tile = (l, v, e, href, t) => `<${href ? 'a href="' + href + '"' : 'div'} class="card k"><small>${l}</small><b>${v}${t ? `<span class="today">오늘 +${t}</span>` : ''}</b>${e ? `<em>${e}</em>` : ''}</${href ? 'a' : 'div'}>`;
  const P = K.newCards.prog;
  const stTot = ST.map(([s]) => [s, nn(s)]).filter(([, v]) => v);
  const mgrs = K.byMgr.map(x => x.mgr);
  $('app').innerHTML = `
  <div class="head"><div><h1>분양전환 KPI</h1><p>${K.today} (${WD[d.getDay()]}) 기준 · 숫자는 전환상태 · 상담카드 · 상담 기록에서 자동으로 셉니다${mgr ? ' · <b>' + esc(mgr) + '</b> 담당 세대만' : ''}</p></div>
    ${mgrs.length ? `<div class="seg">${['', ...mgrs].map(x => `<button class="${x === mgr ? 'on' : ''}" data-m="${esc(x)}">${esc(x || '전체')}</button>`).join('')}</div>` : ''}</div>
  <div class="hero">
    <div class="card k main"><small>분양 완료 (전환 계약완료 + 신규입주)</small><b>${done} <span style="font-size:18px;color:#a1a1a6">/ ${V.length}</span>${td('계약완료', '신규입주') ? `<span class="today">오늘 +${td('계약완료', '신규입주')}</span>` : ''}</b><em>${(done / tot * 100).toFixed(1)}% · 계약완료 ${nn('계약완료')} · 신규입주 ${nn('신규입주')} · 남은 ${V.length - done}세대</em><div class="prog"><i style="width:${nn('계약완료') / tot * 100}%;background:#3b82f6"></i><i style="width:${nn('신규입주') / tot * 100}%;background:#14b8a6"></i></div></div>
    ${tile('계약 진행 (가계약 · 계약중)', nn('가계약', '계약중'), '가 ' + nn('가계약') + ' · 계 ' + nn('계약중'), '', td('가계약', '계약중'))}
    ${tile('상담 진행', nn('상담중', '호실변경', '장기부재'), '상담중 ' + nn('상담중') + ' · 장기부재 ' + nn('장기부재'), '', td('상담중', '호실변경', '장기부재'))}
    ${tile('전세연장', nn('전세연장'), (nn('전세연장') / tot * 100).toFixed(1) + '%', '', td('전세연장'))}
    ${tile('퇴거 · 공실', nn('퇴거확정', '퇴거확정(매물동의)', '공실'), '공실 ' + nn('공실') + ' · 매물동의 ' + nn('퇴거확정(매물동의)'), 'units.html', td('퇴거확정', '퇴거확정(매물동의)', '공실'))}
    ${tile('상태 미정', nn('미정'), '전환상태 화면에서 입력', 'units.html')}
  </div>
  <div class="row2">
    ${tile('방문상담 (오늘)', A.visitToday, '누계 ' + A.visitAll)}
    ${tile('유선 · 문자 상담 (오늘)', A.otherToday, '누계 ' + A.otherAll)}
    ${tile('오늘 예약방문', B.filter(b => b.day === '오늘').length, '내일 ' + B.filter(b => b.day === '내일').length)}
    ${tile('신규고객 카드', K.newCards.total, '상담중 ' + (P['상담중'] || 0) + ' · 계약완료 ' + (P['계약완료'] || 0) + ' · 종료 ' + (P['종료'] || 0), 'consults.html#list=new')}
    ${tile('관심등록 대기', K.leads, '손님 화면에서 들어옴', 'consults.html#list=new')}
    ${tile('손님 화면 공개', K.pub.total, '공실 ' + K.pub.vac + ' · 매물동의 ' + K.pub.out, 'units.html')}
  </div>
  <div class="card dist"><h2>${mgr ? esc(mgr) + ' 담당 ' + V.length + '세대' : '300세대'} 전환 상태</h2><div class="bar">${stTot.map(([s, v]) => `<i title="${esc(s)} ${v}" style="width:${v / tot * 100}%;background:${COL[s]}"></i>`).join('')}</div><div class="lg">${stTot.map(([s, v]) => `<span><i style="background:${COL[s]}"></i>${esc(s)}<b>${v}</b></span>`).join('')}</div></div>
  <div class="cols"><div>
    <div class="card sec">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">미상담 세대 <span style="color:var(--on)">${U.length}세대</span></h2>
        <div class="seg">${[14, 30, 60].map(x => `<button class="${x === days ? 'on' : ''}" data-d="${x}">${x}일</button>`).join('')}<button class="btn" id="csv">CSV 받기</button></div></div>
      <p class="note" style="margin:4px 0 10px">계약완료 · 신규입주 · 전세연장 · 공실을 뺀 세대 중, ${days}일 동안 상담 기록이 없는 세대 — 오래된 순. 줄을 누르면 그 세대 상담카드로</p>
      <div style="overflow-x:auto">${U.length ? `<table><thead><tr><th>동·호</th><th>타입</th><th>전환 상태</th><th>마지막 상담</th><th class="n">지난 날</th><th>담당</th></tr></thead><tbody>
        ${U.slice(0, 100).map(u => `<tr class="go" data-u="${u.id}"><td><b>${uName(u.id)}</b></td><td>${esc(u.type)}</td><td><span class="pill" style="background:${COL[u.st]}22;color:${COL[u.st]}">${esc(u.st)}</span></td><td>${esc(u.last || '기록 없음')}</td><td class="n">${u.ago == null ? '—' : u.ago + '일'}</td><td>${esc(u.mgr || '미배정')}</td></tr>`).join('')}
        ${U.length > 100 ? `<tr><td colspan="6" style="color:var(--sub)">… ${U.length - 100}세대 더 (CSV 받기)</td></tr>` : ''}</tbody></table>` : `<div class="note" style="padding:20px 0;text-align:center">최근 ${days}일 안에 모두 상담했습니다</div>`}</div>
    </div>
  </div><div>
    <div class="card sec"><h2>상태 배치도</h2><div class="dongs">${map()}</div><p class="note">색은 위 '전환 상태' 막대와 같음 · <a href="units.html">전환상태 화면</a>에서 크게 보고 고칠 수 있습니다</p></div>
    <div class="card sec"><h2>담당자별</h2>${K.byMgr.length ? `<div style="overflow-x:auto"><table><thead><tr><th>담당</th><th class="n">카드</th><th class="n">이번 달 상담</th><th class="n">오늘</th><th class="n">계약완료</th><th class="n">미상담</th></tr></thead><tbody>
      ${K.byMgr.map(x => `<tr class="go" data-m="${esc(x.mgr)}"><td><b>${esc(x.mgr)}</b></td><td class="n">${x.cards}</td><td class="n">${x.month}</td><td class="n">${x.today}</td><td class="n">${x.done}</td><td class="n" style="color:var(--on)">${x.unvisited}</td></tr>`).join('')}</tbody></table></div>` : '<div class="note">상담카드에 담당을 적으면 여기에 나옵니다</div>'}</div>
    <div class="card sec"><h2>오늘 · 내일 예약방문</h2>${B.length ? `<table><tbody>${B.map(b => `<tr class="go" data-c="${b.id}"><td><b>${b.day} ${esc(String(b.at).slice(11, 16))}</b></td><td>${b.kind === 'tenant' ? esc(uName(b.unit)) : '신규 · ' + esc(b.name || '') + (b.unit ? ' (' + esc(uName(b.unit)) + ')' : '')}</td><td style="color:var(--sub)">${esc(b.mgr)}</td></tr>`).join('')}</tbody></table>` : '<div class="note">상담카드 \'예약방문\' 칸에 오늘 · 내일 일정이 없습니다</div>'}</div>
  </div></div>`;
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mgr = b.dataset.m === mgr && b.tagName === 'TR' ? '' : b.dataset.m; draw(); scrollTo(0, 0); });
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { days = Number(b.dataset.d); load(); });
  document.querySelectorAll('tr[data-u]').forEach(t => t.onclick = () => { location.href = 'consults.html#unit=' + t.dataset.u; });
  document.querySelectorAll('tr[data-c]').forEach(t => t.onclick = () => { location.href = 'consults.html#id=' + t.dataset.c; });
  if ($('csv')) $('csv').onclick = () => csv(U);
}
function map() {
  return [...new Set(K.units.map(u => u.dong))].map(d => {
    const mine = K.units.filter(u => u.dong === d), lines = [...new Set(mine.map(u => u.line))].sort(), fls = [...new Set(mine.map(u => u.floor))].sort((a, b) => b - a);
    let h = `<div class="dong"><small>${d}동</small><div class="g" style="grid-template-columns:repeat(${lines.length},1fr)">`;
    fls.forEach(f => lines.forEach(l => { const u = mine.find(x => x.floor === f && x.line === l); h += u ? `<i title="${u.id} · ${esc(u.st)}${u.mgr ? ' · ' + esc(u.mgr) : ''}" style="background:${COL[u.st]};${mgr && u.mgr !== mgr ? 'opacity:.15' : ''}"></i>` : '<i style="visibility:hidden"></i>'; }));
    return h + '</div></div>';
  }).join('');
}
function csv(U) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['동·호', '타입', '전환 상태', '마지막 상담', '지난 날', '담당']].concat(U.map(u => [uName(u.id), u.type, u.st, u.last || '기록 없음', u.ago == null ? '' : u.ago, u.mgr]));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv' }));
  a.download = '미상담세대_' + days + '일_' + K.today + '.csv'; a.click();
}
load();
</script>
</body>
</html>
