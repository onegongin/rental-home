<title>첨단대라수1차 위치</title>
<style>
  html, body { margin: 0; padding: 0; background: #f5f5f7; overflow: hidden; }
  .root_daum_roughmap { width: 100% !important; }
</style>
</head>
<body>
<!-- 카카오맵 지도퍼가기 (원본: 소스/입지/카카오맵_지도퍼가기.txt). 사이트의 '입지 · 생활권' 칸에 iframe으로 들어감 -->
<div id="daumRoughmapContainer" class="root_daum_roughmap root_daum_roughmap_landing"></div>
<script charset="UTF-8" class="daum_roughmap_loader_script" src="https://t1.kakaocdn.net/kakaomapweb/roughmap/loader/prod/roughmapLoader.js"></script>
<script charset="UTF-8">
  // 지도 크기를 끼워 넣은 칸(iframe) 크기에 꽉 맞춤. 아래쪽 카카오 안내 줄(로드뷰 · 길찾기 · 지도 크게 보기)은 칸 밖으로 밀려 안 보임 (2026-10-28)
  new daum.roughmap.Lander({
    "timestamp" : "",
    "key" : "",
    "mapWidth" : String(Math.max(280, window.innerWidth)),
    "mapHeight" : String(Math.max(240, window.innerHeight))
  }).render();
</script>
